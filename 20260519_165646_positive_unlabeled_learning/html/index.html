    const topic = document.getElementById('topic');
    const paperCount = document.getElementById('paperCount');
    topic.textContent = data.topic || '';
    paperCount.textContent = String((data.counts && data.counts.papers) || 0);

    function renderKV(containerId, kvObj) {
      const el = document.getElementById(containerId);
      const entries = Object.entries(kvObj || {});
      const maxV = Math.max(1, ...entries.map(e => e[1]));
      el.innerHTML = entries.map(([k, v]) => {
        const pct = Math.round((v / maxV) * 100);
        return `<div style="margin:8px 0">
          <div class="small"><b>${k}</b> · ${v}</div>
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>`;
      }).join('');
    }

    function renderTopList(containerId, list, labelKey, valueKey, maxItems=12) {
      const el = document.getElementById(containerId);
      const items = (list || []).slice(0, maxItems);
      const maxV = Math.max(1, ...items.map(x => x[valueKey]));
      el.innerHTML = items.map((x) => {
        const pct = Math.round((x[valueKey] / maxV) * 100);
        const lbl = x[labelKey];
        const v = x[valueKey];
        return `<div style="margin:8px 0">
          <div class="small"><b>${lbl}</b> · ${v.toFixed ? v.toFixed(3) : v}</div>
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>`;
      }).join('');
    }

    // By year
    renderKV('byYear', (data.counts || {}).by_year);
    // Top venues
    const venuePairs = (data.counts || {}).top_venues || [];
    const venuesObj = {};
    venuePairs.forEach(([k, v]) => { venuesObj[k] = v; });
    renderKV('topVenues', venuesObj);

    // Authors / insts
    renderTopList('topAuthors', data.top_authors || [], 'name', 'score');
    renderTopList('topInsts', data.top_institutions || [], 'name', 'score');

    // Table
    const tbody = document.querySelector('#papersTable tbody');
    (data.papers || []).forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.year || ''}</td><td>${p.venue || ''}</td><td><a href="${p.url || ''}">${p.title || ''}</a></td><td>${(p.score||0).toFixed ? (p.score||0).toFixed(3) : (p.score||0)}</td>`;
      tbody.appendChild(tr);
    });
