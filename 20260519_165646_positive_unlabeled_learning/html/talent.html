    const nodes = graph.nodes || [];
    const edges = graph.edges || [];

    function topNodes(type, k=25) {
      return nodes.filter(n => n.type === type)
        .sort((a,b)=> (b.weight||0)-(a.weight||0))
        .slice(0,k);
    }

    function renderTable(tableId, rows) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      tbody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.label||r.id}</td><td>${(r.weight||0).toFixed ? (r.weight||0).toFixed(3) : (r.weight||0)}</td>`;
        tbody.appendChild(tr);
      });
    }

    renderTable('authors', topNodes('author'));
    renderTable('insts', topNodes('institution'));

    // Edge samples
    const ebody = document.querySelector('#edges tbody');
    edges.slice(0, 60).forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${e.source}</td><td>${e.type}</td><td>${e.target}</td>`;
      ebody.appendChild(tr);
    });

    // Search
    const q = document.getElementById('q');
    const result = document.getElementById('result');
    q.addEventListener('input', () => {
      const s = (q.value||'').toLowerCase().trim();
      if (!s) { result.textContent = ''; return; }
      const hits = nodes.filter(n => (n.label||'').toLowerCase().includes(s)).slice(0, 20);
      if (!hits.length) { result.textContent = 'No matches.'; return; }
      const lines = hits.map(h => `${h.type}: ${h.label} (weight=${(h.weight||0).toFixed ? (h.weight||0).toFixed(3) : (h.weight||0)})`);
      result.textContent = lines.join('\n');
    });
  </script>
